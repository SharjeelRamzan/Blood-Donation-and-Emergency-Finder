
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Services | BloodConnect</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="navbar">

        <a href="index.html" class="logo">
            <div class="logo-symbol">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>+</span>
            </div>

            <div class="logo-name">
                <h2>Blood<span>Connect</span></h2>
                <p>Donate • Find • Save Lives</p>
            </div>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="donor.html">Donor</a>
            <a href="emergency.html" class="active">Emergency</a>
            <a href="hospitals.html">Hospitals</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html">
                <i class="fa-solid fa-user"></i> Login
            </a>

            <a href="signup.html">
                <i class="fa-solid fa-pen"></i> Sign Up
            </a>
        </div>

    </header>


    <!-- EMERGENCY SECTION -->

    <main class="emergency-page">

        <section class="emergency-container">

            <!-- LEFT SIDE -->

            <div class="emergency-content">

                <span class="section-label">
                    Emergency Services
                </span>

                <h1>
                    In Emergency?
                    <br>
                    We're Here to <span>Help</span>
                </h1>

                <p class="emergency-description">
                    Get instant assistance and find emergency
                    services near you.
                </p>

                <a href="tel:1122" class="help-button">
                    Get Help Now
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

            </div>


            <!-- RIGHT SIDE -->

            <div class="emergency-image-section">

                <div class="image-decoration"></div>

                <div class="heartbeat-decoration">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <span class="floating-heart heart-one">♥</span>
                <span class="floating-heart heart-two">♥</span>

                <img
                    class="ambulance-img"
                    src="ambulance.png"
                    alt="White emergency ambulance"
                >

            </div>

        </section>

    </main>

</body>
</html>
